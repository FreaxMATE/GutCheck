name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build & release Android artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Resolve version from pubspec
        id: version
        run: |
          # Extract `version: X.Y.Z+N` from pubspec.yaml.
          line=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          name="${line%+*}"
          code="${line#*+}"
          tag="${GITHUB_REF#refs/tags/}"
          echo "name=$name"   >> "$GITHUB_OUTPUT"
          echo "code=$code"   >> "$GITHUB_OUTPUT"
          echo "tag=$tag"     >> "$GITHUB_OUTPUT"
          # Sanity check: pubspec version must match tag (v1.0.0 -> 1.0.0).
          if [ "v$name" != "$tag" ]; then
            echo "ERROR: tag $tag does not match pubspec version v$name" >&2
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD:   ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload.jks
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        run: flutter build apk --release

      - name: Build app bundle
        run: flutter build appbundle --release

      - name: Stage release artifacts
        id: stage
        run: |
          v="${{ steps.version.outputs.name }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk    "dist/gutcheck-$v-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk  "dist/gutcheck-$v-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk       "dist/gutcheck-$v-x86_64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk              "dist/gutcheck-$v-universal.apk"
          cp build/app/outputs/bundle/release/app-release.aab           "dist/gutcheck-$v.aab"
          ls -lh dist/

      - name: Read changelog
        id: changelog
        run: |
          file="fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.code }}.txt"
          if [ -f "$file" ]; then
            {
              echo 'body<<EOF'
              cat "$file"
              echo
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "body=See commit history for changes." >> "$GITHUB_OUTPUT"
          fi

      - name: Clean up keystore artifacts
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/key.properties

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: GutCheck ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          files: dist/*
          draft: false
          prerelease: false
